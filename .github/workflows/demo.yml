name: Demo

on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: Mensaje a imprimir
        required: true
        default: "Hola desde GitHub Actions"
        type: string

jobs:
  eco:
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir mensaje
        env:
          MENSAJE: ${{ inputs.mensaje }}
        run: echo "$MENSAJE"
